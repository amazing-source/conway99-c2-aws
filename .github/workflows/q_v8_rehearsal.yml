name: q-v8-rehearsal
# Free rehearsal of package v8 on a fresh Linux machine (C2, 2026-10-02). Run on the branch carrying package v8
# (gh workflow run q_v8_rehearsal.yml --ref v8). Branch queue-ci must hold three real jobs: 118:2:8 (stream), 010:5:128 (golay sub-block,
# compact format) and r037:0:28 (job kind resolve; v6 rehearsal: EXCLUDED with exactly the PC's 286,986,404 nodes, about 40 min).
# v8 = v7 + the resolve lists of 023, 024, 026, 028 (118 INCOMPLETE pairs, one per job); no code change. The new lists were checked on the
# lab PC by scripts/smoke_resolve_lists.py (exact conversion into U, norms, orthogonality, sha, job slices tile each list).
#   V1: q/qmachine.sh --inner (Q_TEST): install, the calibrations (118:2, v2 stream of 011, calib_v4: golay 001 slice + O24 kernel 3 +
#       O24 joint planted + golay 010 compact slice + retry path), the agent runs the three jobs, FINI, PKG=v8, engine sha per job kind.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v8:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      Q_TEST: "1"
      Q_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      Q_QUEUE: queue-ci
      Q_RUNPREFIX: run/qci-
      Q_TEST_PRICE: "0.10"
      Q_HEARTBEAT: "60"
      Q_WORKERS: "1"
      EXPECT_PKG: "v8"
    steps:
      - uses: actions/checkout@v4
      - name: V1 - fresh machine, package v8, calibrations, three real jobs (golay 010 compact + stream + resolve r037)
        run: |
          git config --global user.name amazing-source; git config --global user.email 206353265+amazing-source@users.noreply.github.com
          set +e
          Q_TEST_NAME=v8a bash q/qmachine.sh --inner > $HOME/qm.log 2>&1; echo "qmachine exit $?"
          tail -25 $HOME/qm.log
          echo "--- calibration 118:2"; cat $HOME/c2_cloud_run/calib_check.txt
          echo "--- calibrations v2 + v4-checks"; cat $HOME/c2_cloud_run/calib_extra_check.txt
          echo "--- agent log"; cat $HOME/q_agent_qci-v8a.log
          echo "--- job outputs"; for f in $HOME/c2_cloud_run/results/*_consumer.out; do echo "$f"; tail -n 3 "$f"; done
          set -e
          python3 q/tools/v2_check.py s1 qci-v8a
